<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бар Recept — Меню</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #e5a93b;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    header {
      position: sticky;
      top: 0;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      padding: 12px 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--accent);
    }

    .lang-switcher select {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--accent);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border-color: var(--accent);
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 18px;
      color: var(--accent);
      margin: 20px 0 12px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-left: 3px solid var(--accent);
      padding-left: 8px;
    }

    .menu-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
